<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zero Forest</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css" />
<style>
  :root {
    --bg-base: #0B0F0D;
    --bg-elevated: #121815;
    --bg-hover: #171F1B;

    --text-primary: #E8EDE9;
    --text-secondary: #9BA8A0;
    --text-tertiary: #5F6D66;

    --stage-growing: #7DD8A0;
    --stage-sprout: #4FA97A;
    --stage-seed: #2E6B50;
    --stage-dormant: #4A5A52;

    --line-subtle: #1C2621;
    --line-default: #263330;
    --line-strong: #37473F;

    --green-bright: #7DD8A0;

    --font-serif: 'Fraunces', Georgia, serif;
    --font-sans: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;

    --radius: 3px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg-base);
    color: var(--text-primary);
    font-family: var(--font-sans);
    overflow: hidden;
  }

  :focus-visible { outline: 1px solid var(--green-bright); outline-offset: 3px; }

  .page {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 64px;
    padding: 24px;
  }

  .page__header {
    text-align: center;
  }

  .page__title {
    margin: 0 0 8px;
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: 40px;
    letter-spacing: -0.02em;
  }

  .page__sub {
    margin: 0;
    color: var(--text-tertiary);
    font-size: 16px;
  }

  .dock-row {
    display: flex;
    align-items: flex-end;
    gap: 22px;
    padding: 30px 40px 46px;
  }

  .dock-card {
    width: 132px;
    flex-shrink: 0;
    background: var(--bg-elevated);
    border: 1px solid var(--line-default);
    border-radius: 10px;
    padding: 16px 14px;
    cursor: pointer;
    transform-origin: 50% 100%;
    will-change: transform;
    transition: background-color 160ms ease, border-color 160ms ease;
    user-select: none;
  }

  .dock-card:hover,
  .dock-card:focus-visible {
    background: var(--bg-hover);
    border-color: var(--line-strong);
  }

  .dock-card__badge {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 14px;
  }

  .dock-card__dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .dock-card__stage {
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-tertiary);
  }

  .dock-card__title {
    margin: 0 0 6px;
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: 19px;
    letter-spacing: -0.01em;
  }

  .dock-card__desc {
    margin: 0;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--text-secondary);
  }

  @media (max-width: 720px) {
    .dock-row {
      flex-wrap: wrap;
      justify-content: center;
      padding: 30px 20px;
    }
  }
</style>
</head>
<body>

<div class="page">
  <header class="page__header">
    <h1 class="page__title">Zero Forest</h1>
    <p class="page__sub">자라는 중인 것들.</p>
  </header>

  <div class="dock-row" id="dockRow">
    <article class="dock-card" data-stage="growing" tabindex="0">
      <div class="dock-card__badge">
        <span class="dock-card__dot" style="background:var(--stage-growing)"></span>
        <span class="dock-card__stage">Growing</span>
      </div>
      <h2 class="dock-card__title">Aurora Log</h2>
      <p class="dock-card__desc">감정을 기록하는 앱</p>
    </article>

    <article class="dock-card" data-stage="sprout" tabindex="0">
      <div class="dock-card__badge">
        <span class="dock-card__dot" style="background:var(--stage-sprout)"></span>
        <span class="dock-card__stage">Sprout</span>
      </div>
      <h2 class="dock-card__title">Tidepool</h2>
      <p class="dock-card__desc">습관을 물결처럼 쌓는 도구</p>
    </article>

    <article class="dock-card" data-stage="seed" tabindex="0">
      <div class="dock-card__badge">
        <span class="dock-card__dot" style="background:var(--stage-seed)"></span>
        <span class="dock-card__stage">Seed</span>
      </div>
      <h2 class="dock-card__title">Quiet Ledger</h2>
      <p class="dock-card__desc">조용한 지출 기록</p>
    </article>

    <article class="dock-card" data-stage="dormant" tabindex="0">
      <div class="dock-card__badge">
        <span class="dock-card__dot" style="background:var(--stage-dormant)"></span>
        <span class="dock-card__stage">Dormant</span>
      </div>
      <h2 class="dock-card__title">Paper Weather</h2>
      <p class="dock-card__desc">날씨 대신 날씨를 그리는 메모</p>
    </article>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  (function () {
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var dockRow = document.getElementById('dockRow');
    var cards = Array.prototype.slice.call(document.querySelectorAll('.dock-card'));

    if (reduceMotion || typeof gsap === 'undefined') return;

    var SIGMA = 130;
    var MAX_GROW = 0.55;
    var LIFT = 34;

    var scaleTo = cards.map(function (card) {
      return gsap.quickTo(card, 'scale', { duration: 0.35, ease: 'power3' });
    });
    var yTo = cards.map(function (card) {
      return gsap.quickTo(card, 'y', { duration: 0.35, ease: 'power3' });
    });
    var zTo = cards.map(function (card) {
      return gsap.quickTo(card, 'zIndex', { duration: 0, ease: 'none' });
    });

    function applyMagnify(pointerX) {
      cards.forEach(function (card, i) {
        var rect = card.getBoundingClientRect();
        var baseWidth = rect.width / (gsap.getProperty(card, 'scale') || 1);
        var cx = rect.left + rect.width / 2;
        var dist = pointerX === null ? Infinity : Math.abs(pointerX - cx);
        var scale = 1 + MAX_GROW * Math.exp(-(dist * dist) / (2 * SIGMA * SIGMA));
        scaleTo[i](scale);
        yTo[i](-(scale - 1) * LIFT);
        card.style.zIndex = Math.round(scale * 100);
      });
    }

    dockRow.addEventListener('pointermove', function (e) {
      applyMagnify(e.clientX);
    });

    dockRow.addEventListener('pointerleave', function () {
      applyMagnify(null);
    });

    cards.forEach(function (card) {
      card.addEventListener('click', function () {
        gsap.fromTo(card,
          { y: '-=18' },
          { y: '+=18', duration: 0.5, ease: 'elastic.out(1, 0.45)' }
        );
      });
      card.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          card.click();
        }
      });
    });
  })();
</script>

</body>
</html>
